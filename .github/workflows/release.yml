name: Signed Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

jobs:
  build-sign-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Check release key configuration
        shell: powershell
        env:
          # Base64 of the 32-byte Ed25519 seed. The private key never enters the
          # repository, a build product, or the logs.
          YOUZIAUTH_RELEASE_KEY: ${{ secrets.YOUZIAUTH_RELEASE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUZIAUTH_RELEASE_KEY)) {
            throw "Missing YOUZIAUTH_RELEASE_KEY Actions secret. Add the base64 Ed25519 release seed before tagging."
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.0"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install --requirement requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run front-end tests
        shell: powershell
        run: |
          # See .github/workflows/ci.yml: `unittest discover` never runs tests/test_desktop_ui.cjs,
          # so a release has to gate on it explicitly or a UI regression ships published.
          $version = (node --version).TrimStart('v')
          if ([int]$version.Split('.')[0] -lt 18) {
            throw "The front-end suite needs Node 18+ for node --test (runner has $version)."
          }
          node --test tests/test_desktop_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw "Front-end tests failed" }
      - name: Verify tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag/version mismatch"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build MSI
        shell: powershell
        run: .\build_msi.ps1 -InstallDependencies -VerifyPayload
      - name: Sign MSI with the release key
        shell: powershell
        env:
          YOUZIAUTH_RELEASE_KEY: ${{ secrets.YOUZIAUTH_RELEASE_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          python .\tools\sign_release.py --msi .\dist\youziauth.msi --version $env:RELEASE_VERSION --output-dir .\release
          if ($LASTEXITCODE -ne 0) { throw "Signing the release failed" }
          # The signer already refuses a key that does not match the key compiled
          # into the client, so a misconfigured secret fails here, not for users.
          Copy-Item .\release\youziauth.msi.ed25519 .\dist\youziauth.msi.ed25519 -Force
      - name: Verify signed release
        shell: powershell
        run: ./packaging/verify_release.ps1 -MsiPath ./dist/youziauth.msi -Version $env:RELEASE_VERSION -OutputDirectory ./release
      - name: Publish the hand-written Chinese notes
        shell: powershell
        run: |
          # 客户端「这次更新改了什么」优先读这个资产，来自 docs/release-notes/v<版本>.md。
          # 发布前就要求文件存在，所以**先写说明再打 tag**。
          New-Item -ItemType Directory -Force -Path .\release | Out-Null
          $source = "docs/release-notes/v$env:RELEASE_VERSION.md"
          if (-not (Test-Path $source)) {
            throw "Missing $source. Write the Chinese notes for this release before tagging."
          }
          $first = (Get-Content $source -TotalCount 1).Trim()
          if ($first -notmatch '^#{1,6}\s+v?[0-9][0-9.]*\s*$') {
            throw "$source must start with a heading holding the version, for example '## v$env:RELEASE_VERSION'."
          }
          if ((($first -replace '^#{1,6}\s+','') -replace '^v','').Trim() -ne $env:RELEASE_VERSION) {
            throw "$source is headed '$first' but this release is v$env:RELEASE_VERSION."
          }
          Copy-Item $source .\release\release-notes.md -Force
      - name: Publish signed release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\dist\youziauth.msi `
            .\release\SHA256SUMS.txt `
            .\release\youziauth.msi.ed25519 `
            .\release\release-notes.md `
            .\release\release-provenance.json `
            --verify-tag --generate-notes
